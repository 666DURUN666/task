<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Репетитор — личные кабинеты v1.3.1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="window._katexReady=true"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #edfdff;
    --bg2: #ffffff;
    --border: #dddce8;
    --text: #1a1a2e;
    --text2: #555;
    --text3: #888;
    --accent: #3bdbb6;
    --accent-dark: #2cba99;
    --accent-bg: #e6f7f3;
    --green: #2f9e44;
    --green-bg: #ebfbee;
    --red: #c92a2a;
    --red-bg: #fff5f5;
    --orange: #e67700;
    --yellow-bg: #fff9db;
    --yellow: #e67700;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.12);
    --radius: 12px;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  input, textarea, select, button { font-family: inherit; }

  /* ========== AUTH SCREEN ========== */
  #auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .auth-box {
    background: white;
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow-lg);
  }
  .auth-box h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text); }
  .auth-box p { font-size: 0.85rem; color: var(--text2); margin-bottom: 1.5rem; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text2);
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    background: white;
    transition: 0.2s;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,219,182,0.1); }
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
  .error-msg { color: var(--red); font-size: 0.8rem; margin-top: 0.75rem; text-align: center; }

  /* ========== MAIN APP ========== */
  #app { display: none; min-height: 100vh; }
  .topbar {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar h2 { font-size: 1rem; font-weight: 600; color: var(--text); }
  .topbar-role {
    font-size: 0.75rem;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 500;
  }
  .role-tutor { background: var(--accent-bg); color: var(--accent-dark); }
  .role-student { background: var(--green-bg); color: var(--green); }
  .btn-sm {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 7px;
    font-size: 0.8rem;
    cursor: pointer;
    color: var(--text2);
    transition: 0.2s;
  }
  .btn-sm:hover { background: var(--bg); }
  .btn-danger-sm { border-color: #ffc9c9; color: var(--red); }
  .btn-danger-sm:hover { background: var(--red-bg); }

  /* ========== TUTOR PANEL ========== */
  #tutor-panel { display: none; }
  .tutor-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 56px);
  }
  .sidebar {
    background: white;
    border-right: 1px solid var(--border);
    padding: 1.5rem 1rem;
    overflow-y: auto;
    max-height: calc(100vh - 56px);
  }
  .sidebar h3 {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 1rem;
  }
  .student-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid transparent;
    transition: 0.15s;
  }
  .student-item:hover { background: var(--bg); border-color: var(--border); }
  .student-item.active { background: var(--accent-bg); border-color: var(--accent); }
  .student-item .sname { font-size: 0.85rem; font-weight: 600; color: var(--text); }
  .student-item .slogin { font-size: 0.7rem; color: var(--text3); margin-top: 2px; }
  .del-btn {
    font-size: 0.75rem;
    color: var(--text3);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    opacity: 0;
    transition: 0.15s;
  }
  .student-item:hover .del-btn { opacity: 1; }
  .del-btn:hover { background: var(--red-bg); color: var(--red); }
  .add-student-form { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .add-student-form input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.8rem;
    margin-bottom: 8px;
  }
  .btn-add {
    width: 100%;
    padding: 8px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
    transition: 0.2s;
  }
  .btn-add:hover { background: var(--accent-dark); }

  /* ========== EDITOR ========== */
  .editor-area {
    padding: 1.5rem;
    background: var(--bg);
    overflow-y: auto;
    max-height: calc(100vh - 56px);
  }
  .editor-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 400px;
    color: var(--text3);
    font-size: 0.9rem;
  }
  .editor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .editor-header h2 { font-size: 1.2rem; font-weight: 600; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .tool-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: white;
    border-radius: 8px;
    font-size: 0.75rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: 0.15s;
  }
  .tool-btn:hover { background: var(--bg); border-color: var(--accent); }
  .blocks-list { display: flex; flex-direction: column; gap: 12px; }
  .block {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: 0.15s;
  }
  .block:hover { box-shadow: var(--shadow); }
  .block-handle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #fafafa;
    border-bottom: 1px solid var(--border);
  }
  .block-type-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text3);
  }
  .block-actions { display: flex; gap: 4px; }
  .bact-btn, .move-btn {
    font-size: 0.7rem;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    background: white;
    transition: 0.15s;
  }
  .bact-btn.remove { color: var(--red); border-color: #ffc9c9; }
  .bact-btn.remove:hover { background: var(--red-bg); }
  .move-btn:hover { background: var(--bg); }
  .block-content { padding: 14px; }
  
  /* ===== УЛУЧШЕННЫЙ ДИЗАЙН ДЛЯ ЗАГОЛОВКА ===== */
  .heading-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .heading-row select {
    width: auto;
    min-width: 100px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
  }
  .heading-row select:hover {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .heading-row select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(59, 219, 182, 0.2);
  }
  .heading-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    transition: 0.2s;
  }
  .heading-row input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(59, 219, 182, 0.1);
  }
  
  .block-content textarea, .block-content input[type="text"]:not(.heading-row input) {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    background: white;
  }
  .block-content textarea:focus, .block-content input:focus { outline: none; border-color: var(--accent); }
  .formula-preview {
    margin-top: 8px;
    padding: 10px;
    background: var(--bg);
    border-radius: 8px;
    font-size: 1rem;
    min-height: 50px;
    overflow-x: auto;
  }
  .img-preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 8px; }
  .quiz-options { margin-top: 8px; }
  .quiz-option-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .quiz-option-row input[type=text] { flex: 1; }
  .quiz-option-row input[type=radio] { width: auto; margin: 0; }
  .rm-opt {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 1rem;
    padding: 0 4px;
  }
  .rm-opt:hover { color: var(--red); }
  .add-opt-btn {
    font-size: 0.75rem;
    color: var(--accent-dark);
    cursor: pointer;
    background: none;
    border: none;
    text-decoration: underline;
    margin-top: 6px;
  }
  .save-btn {
    padding: 8px 20px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
  }
  .save-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .saved-notice {
    font-size: 0.8rem;
    color: var(--green);
    margin-left: 10px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .saved-notice.show { opacity: 1; }
  .github-info {
    background: var(--yellow-bg);
    border: 1px solid #ffe066;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.75rem;
    color: var(--orange);
    margin-bottom: 1rem;
  }
  .github-info a { color: var(--orange); }

  /* ========== STUDENT VIEW ========== */
  #student-panel { display: none; }
  .student-view {
    max-width: 850px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }
  .student-view h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.25rem; }
  .student-view .subtitle { color: var(--text3); font-size: 0.85rem; margin-bottom: 1.5rem; }
  .view-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
  }
  .view-tab {
    padding: 6px 18px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--text2);
    border-radius: 20px;
    transition: 0.2s;
  }
  .view-tab:hover { background: var(--bg); }
  .view-tab.active {
    background: var(--accent);
    color: white;
  }
  .view-block { margin-bottom: 1.5rem; }
  .view-block h2, .view-block h3 { margin-bottom: 0.5rem; color: var(--text); }
  .view-block p { line-height: 1.6; color: var(--text2); }
  .formula-display {
    padding: 12px 16px;
    background: var(--bg);
    border-radius: 8px;
    overflow-x: auto;
  }
  .video-wrap {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 12px;
    overflow: hidden;
  }
  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .audio-player { width: 100%; margin: 8px 0; }
  .quiz-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .quiz-card .question { font-weight: 600; font-size: 1rem; margin-bottom: 15px; }
  .quiz-opt {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: 0.15s;
  }
  .quiz-opt:hover { background: var(--bg); }
  .quiz-opt.correct { background: var(--green-bg); border-color: #b0e0b0; color: var(--green); }
  .quiz-opt.wrong { background: var(--red-bg); border-color: #ffc9c9; color: var(--red); }
  .quiz-opt.selected { border-color: var(--accent); background: var(--accent-bg); }
  .quiz-check-btn {
    margin-top: 12px;
    padding: 8px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  .quiz-check-btn:hover { background: var(--accent-dark); }
  .quiz-result { margin-top: 12px; font-size: 0.85rem; font-weight: 500; }
  .quiz-result.ok { color: var(--green); }
  .quiz-result.fail { color: var(--red); }
  .callout-block {
    padding: 12px 16px;
    border-left: 3px solid var(--accent);
    background: var(--accent-bg);
    border-radius: 0 8px 8px 0;
  }
  .file-download-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    font-weight: 500;
    transition: 0.15s;
  }
  .file-download-btn:hover { background: var(--bg); }

  /* ========== HOMEWORK TABLE ========== */
  .homework-section { margin-top: 0.5rem; }
  .homework-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .homework-table th, .homework-table td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .homework-table th {
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .homework-table tr:hover { background: var(--bg); }
  .deadline-overdue { color: var(--red); font-weight: bold; }
  .deadline-soon { color: var(--orange); }
  .status-done { color: var(--green); }
  .stats-card {
    background: white;
    border-radius: var(--radius);
    padding: 1rem;
    box-shadow: var(--shadow);
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
  }

  /* ========== MODAL ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal {
    background: white;
    border-radius: var(--radius);
    padding: 1.5rem;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-lg);
  }
  .modal h3 { font-size: 1.2rem; margin-bottom: 1rem; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.5rem; }

  /* ========== PRINT STYLES ========== */
  @media print {
    .topbar, .sidebar, .toolbar, .add-student-form, .btn-sm, .save-btn, .github-info,
    .modal-overlay, .block-actions, .move-btn, .quiz-check-btn, .view-tabs, .print-hide { display: none !important; }
    body { background: white; padding: 0; margin: 0; }
    .student-view { padding: 0; max-width: 100%; }
    .view-block { page-break-inside: avoid; }
  }

  @media (max-width: 700px) {
    .tutor-layout { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 300px; }
    .homework-table { font-size: 0.75rem; }
    .homework-table th, .homework-table td { padding: 8px; }
    .heading-row { flex-direction: column; align-items: stretch; }
    .heading-row select { width: 100%; }
  }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <h1>📐 Репетитор</h1>
    <p>Личные кабинеты учеников</p>
    <div class="auth-tabs">
      <button class="tab-btn active" onclick="setAuthTab('tutor')">Репетитор</button>
      <button class="tab-btn" onclick="setAuthTab('student')">Ученик</button>
    </div>
    <div id="tab-tutor">
      <div class="field"><label>Мастер-пароль</label><input type="password" id="tutor-pass" placeholder="Ваш пароль" onkeydown="if(event.key==='Enter')loginTutor()"></div>
      <button class="btn-primary" onclick="loginTutor()">Войти как репетитор</button>
    </div>
    <div id="tab-student" style="display:none">
      <div class="field"><label>Логин ученика</label><input type="text" id="stu-login" placeholder="Например: ivanov"></div>
      <div class="field"><label>Пароль</label><input type="password" id="stu-pass" placeholder="Пароль"></div>
      <button class="btn-primary" onclick="loginStudent()">Войти</button>
    </div>
    <div id="auth-error" class="error-msg"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left"><h2>📐 Репетитор</h2><span id="topbar-role" class="topbar-role role-tutor">Репетитор</span></div>
    <div style="display:flex;gap:8px;">
      <button class="btn-sm" onclick="openGitHubModal()">⚙ GitHub</button>
      <button class="btn-sm btn-danger-sm" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div id="tutor-panel">
    <div class="tutor-layout">
      <div class="sidebar">
        <h3>Ученики</h3>
        <div id="students-list"></div>
        <div class="add-student-form">
          <input type="text" id="new-name" placeholder="Имя (Иванов А.)">
          <input type="text" id="new-login" placeholder="Логин (ivanov)">
          <input type="password" id="new-password" placeholder="Пароль">
          <button class="btn-add" onclick="addStudent()">+ Добавить</button>
        </div>
      </div>
      <div class="editor-area" id="editor-area">
        <div class="editor-empty" id="editor-empty">← Выберите ученика для редактирования</div>
        <div id="editor-content" style="display:none">
          <div class="editor-header"><h2 id="editor-student-name"></h2><div><button class="save-btn" onclick="savePage()">💾 Сохранить</button><span class="saved-notice" id="saved-notice">Сохранено!</span></div></div>
          <div class="github-info" id="github-info" style="display:none">⚠ GitHub не настроен. <a href="#" onclick="openGitHubModal();return false;">Настроить →</a></div>
          <div class="toolbar">
            <button class="tool-btn" onclick="addBlock('heading')">📝 Заголовок</button>
            <button class="tool-btn" onclick="addBlock('text')">✏️ Текст</button>
            <button class="tool-btn" onclick="addBlock('formula')">∑ Формула</button>
            <button class="tool-btn" onclick="addBlock('image')">🖼 Картинка</button>
            <button class="tool-btn" onclick="addBlock('video')">▶ Видео</button>
            <button class="tool-btn" onclick="addBlock('audio')">🎵 Аудио</button>
            <button class="tool-btn" onclick="addBlock('quiz')">❓ Тест</button>
            <button class="tool-btn" onclick="addBlock('callout')">💡 Заметка</button>
            <button class="tool-btn" onclick="addBlock('divider')">— Разделитель</button>
            <button class="tool-btn" onclick="addBlock('file')">📎 Файл</button>
          </div>
          <div class="blocks-list" id="blocks-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="student-panel">
    <div class="student-view">
      <h1 id="sv-name"></h1>
      <p class="subtitle" id="sv-subtitle"></p>
      <div class="view-tabs">
        <button class="view-tab active" data-tab="materials" onclick="switchStudentTab('materials')">📚 Материалы</button>
        <button class="view-tab" data-tab="homework" onclick="switchStudentTab('homework')">📅 ДЗ</button>
        <button class="view-tab" data-tab="stats" onclick="switchStudentTab('stats')">📊 Статистика</button>
        <button class="view-tab print-hide" onclick="exportToPDF()">🖨 Экспорт PDF</button>
      </div>
      <div id="student-materials"></div>
      <div id="student-homework" style="display:none"></div>

</div>

<div id="github-modal" style="display:none" class="modal-overlay"><div class="modal"><h3>⚙ GitHub Sync</h3><div class="field"><label>Username</label><input id="gh-user"></div><div class="field"><label>Repo</label><input id="gh-repo"></div><div class="field"><label>Token</label><input id="gh-token" type="password"></div><div class="modal-actions"><button class="btn-sm" onclick="closeModal()">Отмена</button><button class="btn-primary" style="width:auto" onclick="saveGitHubConfig()">Сохранить</button></div></div></div>

<script>
const MASTER_PASS = 'jnfc200408';
let currentRole = null, currentStudent = null, currentEditLogin = null, currentStudentTab = 'materials';

function getData() { let d = localStorage.getItem('tutor_data'); if(d) return JSON.parse(d); let init={students:[{name:'Иванова Аня',login:'anya',password:'math1',blocks:[{id:'ex1',type:'heading',data:{level:'h2',text:'Тема: Теорема Пифагора'}}],quizResults:{},homeworks:[]},{name:'Петров Коля',login:'kolya',password:'geom2',blocks:[],quizResults:{},homeworks:[]}]}; localStorage.setItem('tutor_data',JSON.stringify(init)); return init; }
function setData(d) { localStorage.setItem('tutor_data',JSON.stringify(d)); }
function getGH() { let d=localStorage.getItem('gh_config'); return d?JSON.parse(d):null; }
function setGH(cfg) { localStorage.setItem('gh_config',JSON.stringify(cfg)); }

function setAuthTab(tab) { document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='tutor')||(i===1&&tab==='student'))); document.getElementById('tab-tutor').style.display=tab==='tutor'?'block':'none'; document.getElementById('tab-student').style.display=tab==='student'?'block':'none'; }
function loginTutor() { if(document.getElementById('tutor-pass').value!==MASTER_PASS){document.getElementById('auth-error').textContent='Неверный пароль';return;} currentRole='tutor'; document.getElementById('topbar-role').textContent='🎓 Репетитор'; document.getElementById('topbar-role').className='topbar-role role-tutor'; showApp('tutor'); }
function loginStudent() { let login=document.getElementById('stu-login').value.trim().toLowerCase(), pass=document.getElementById('stu-pass').value, data=getData(), stu=data.students.find(s=>s.login===login&&s.password===pass); if(!stu){document.getElementById('auth-error').textContent='Неверный логин или пароль';return;} currentRole='student'; currentStudent=stu; document.getElementById('topbar-role').textContent='📚 '+stu.name; showApp('student'); renderStudentView(); }
function showApp(role) { document.getElementById('auth-screen').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('tutor-panel').style.display=role==='tutor'?'block':'none'; document.getElementById('student-panel').style.display=role==='student'?'block':'none'; if(role==='tutor') renderSidebar(); }
function logout() { currentRole=null; currentStudent=null; currentEditLogin=null; document.getElementById('auth-screen').style.display='flex'; document.getElementById('app').style.display='none'; }
function renderSidebar() { let data=getData(), list=document.getElementById('students-list'); list.innerHTML=''; data.students.forEach(stu=>{ let div=document.createElement('div'); div.className='student-item'+(currentEditLogin===stu.login?' active':''); div.innerHTML=`<div><div class="sname">${esc(stu.name)}</div><div class="slogin">@${esc(stu.login)}</div></div><span class="del-btn" onclick="deleteStudent('${stu.login}',event)">✕</span>`; div.onclick=(e)=>{if(!e.target.classList.contains('del-btn')) openEditor(stu.login);}; list.appendChild(div); }); document.getElementById('github-info').style.display=getGH()?'none':'block'; }
function deleteStudent(login,e){ e.stopPropagation(); if(!confirm('Удалить ученика?')) return; let data=getData(); data.students=data.students.filter(s=>s.login!==login); setData(data); if(currentEditLogin===login){currentEditLogin=null;closeEditor();} renderSidebar(); }
function addStudent(){ let name=document.getElementById('new-name').value.trim(), login=document.getElementById('new-login').value.trim().toLowerCase(), pass=document.getElementById('new-password').value.trim(); if(!name||!login||!pass){alert('Заполните все поля');return;} let data=getData(); if(data.students.find(s=>s.login===login)){alert('Логин занят');return;} data.students.push({name,login,password:pass,blocks:[],quizResults:{},homeworks:[]}); setData(data); document.getElementById('new-name').value=''; document.getElementById('new-login').value=''; document.getElementById('new-password').value=''; renderSidebar(); openEditor(login); }
function openEditor(login){ currentEditLogin=login; let stu=getData().students.find(s=>s.login===login); document.getElementById('editor-empty').style.display='none'; document.getElementById('editor-content').style.display='block'; document.getElementById('editor-student-name').textContent='📄 '+stu.name; renderBlocks(stu.blocks); renderSidebar(); }
function closeEditor(){ document.getElementById('editor-empty').style.display='flex'; document.getElementById('editor-content').style.display='none'; renderSidebar(); }
function renderBlocks(blocks){ let list=document.getElementById('blocks-list'); list.innerHTML=''; blocks.forEach((block,idx)=>{list.appendChild(createBlockEl(block,idx,blocks.length));}); renderAllFormulas(); }
function createBlockEl(block,idx,total){ let div=document.createElement('div'); div.className='block'; div.dataset.id=block.id; let typeNames={heading:'Заголовок',text:'Текст',formula:'Формула',image:'Картинка',video:'Видео',audio:'Аудио',quiz:'Тест',callout:'Заметка',divider:'Разделитель',file:'Файл'}; let content='';
  if(block.type==='heading') content=`<div class="block-content"><div class="heading-row"><select onchange="updateBlock('${block.id}','level',this.value)"><option value="h1"${block.data.level==='h1'?' selected':''}>H1 — Крупный</option><option value="h2"${block.data.level==='h2'?' selected':''}>H2 — Средний</option><option value="h3"${block.data.level==='h3'?' selected':''}>H3 — Мелкий</option></select><input type="text" value="${esc(block.data.text||'')}" placeholder="Текст заголовка" oninput="updateBlock('${block.id}','text',this.value)"></div></div>`;
  else if(block.type==='text') content=`<div class="block-content"><textarea placeholder="Текст..." oninput="updateBlock('${block.id}','text',this.value)">${esc(block.data.text||'')}</textarea></div>`;
  else if(block.type==='formula') content=`<div class="block-content"><input type="text" value="${esc(block.data.tex||'')}" placeholder="LaTeX" oninput="updateBlock('${block.id}','tex',this.value);renderFormula(this,this.nextElementSibling)"><div class="formula-preview" id="fp-${block.id}"></div></div>`;
  else if(block.type==='image') content=`<div class="block-content"><input type="text" value="${esc(block.data.url||'')}" placeholder="URL" oninput="updateBlock('${block.id}','url',this.value)"><div style="margin-top:5px"><label style="cursor:pointer;color:var(--accent);font-size:0.75rem">📁 Выбрать файл <input type="file" accept="image/*" style="display:none" onchange="loadImage(event,'${block.id}')"></label></div>${block.data.url?`<img src="${block.data.url}" class="img-preview">`:''}<input type="text" value="${esc(block.data.caption||'')}" placeholder="Подпись" oninput="updateBlock('${block.id}','caption',this.value)"></div>`;
  else if(block.type==='video') content=`<div class="block-content"><input type="text" value="${esc(block.data.url||'')}" placeholder="YouTube URL" oninput="updateBlock('${block.id}','url',this.value)"><input type="text" value="${esc(block.data.caption||'')}" placeholder="Подпись" oninput="updateBlock('${block.id}','caption',this.value)"></div>`;
  else if(block.type==='audio') content=`<div class="block-content"><input type="text" value="${esc(block.data.url||'')}" placeholder="URL аудиофайла (.mp3, .ogg)" oninput="updateBlock('${block.id}','url',this.value)"><input type="text" value="${esc(block.data.caption||'')}" placeholder="Подпись" oninput="updateBlock('${block.id}','caption',this.value)"><audio controls src="${block.data.url||''}" style="width:100%;margin-top:8px"></audio></div>`;
  else if(block.type==='quiz'){ let opts=block.data.options||['','','','']; let optsHtml=opts.map((o,oi)=>`<div class="quiz-option-row"><input type="radio" name="qc-${block.id}" ${oi===block.data.correct?'checked':''} onchange="updateBlock('${block.id}','correct',${oi})"><input type="text" value="${esc(o)}" placeholder="Вариант ${oi+1}" oninput="updateOption('${block.id}',${oi},this.value)">${opts.length>2?`<button class="rm-opt" onclick="removeOption('${block.id}',${oi})">✕</button>`:''}</div>`).join(''); content=`<div class="block-content"><input type="text" value="${esc(block.data.question||'')}" placeholder="Вопрос" oninput="updateBlock('${block.id}','question',this.value)"><div class="quiz-options" id="qopts-${block.id}">${optsHtml}</div><button class="add-opt-btn" onclick="addOption('${block.id}')">+ Добавить вариант</button><input type="text" value="${esc(block.data.hint||'')}" placeholder="Подсказка" oninput="updateBlock('${block.id}','hint',this.value)"></div>`; }
  else if(block.type==='callout') content=`<div class="block-content"><textarea placeholder="Текст заметки..." oninput="updateBlock('${block.id}','text',this.value)">${esc(block.data.text||'')}</textarea></div>`;
  else if(block.type==='divider') content=`<div class="block-content" style="color:var(--text3);font-size:0.8rem;text-align:center">— разделитель —</div>`;
  else if(block.type==='file') content=`<div class="block-content"><input type="text" value="${esc(block.data.url||'')}" placeholder="URL файла" oninput="updateBlock('${block.id}','url',this.value)"><input type="text" value="${esc(block.data.label||'Скачать')}" placeholder="Текст кнопки" oninput="updateBlock('${block.id}','label',this.value)"></div>`;
  div.innerHTML=`<div class="block-handle"><span class="block-type-label">${typeNames[block.type]}</span><div class="block-actions">${idx>0?`<button class="move-btn" onclick="moveBlock('${block.id}',-1)">↑</button>`:''}${idx<total-1?`<button class="move-btn" onclick="moveBlock('${block.id}',1)">↓</button>`:''}<button class="bact-btn remove" onclick="removeBlock('${block.id}')">Удалить</button></div></div>${content}`;
  return div;
}
function addBlock(type){ if(!currentEditLogin) return; let data=getData(), stu=data.students.find(s=>s.login===currentEditLogin); let id='b'+Date.now(); let defaults={heading:{level:'h2',text:''},text:{text:''},formula:{tex:''},image:{url:'',caption:''},video:{url:'',caption:''},audio:{url:'',caption:''},quiz:{question:'',options:['','','',''],correct:0,hint:''},callout:{text:''},divider:{},file:{url:'',label:'Скачать'}}; stu.blocks.push({id,type,data:defaults[type]||{}}); setData(data); renderBlocks(stu.blocks); }
function removeBlock(id){ let data=getData(), stu=data.students.find(s=>s.login===currentEditLogin); stu.blocks=stu.blocks.filter(b=>b.id!==id); setData(data); renderBlocks(stu.blocks); }
function moveBlock(id,dir){ let data=getData(), stu=data.students.find(s=>s.login===currentEditLogin); let idx=stu.blocks.findIndex(b=>b.id===id); let newIdx=idx+dir; if(newIdx<0||newIdx>=stu.blocks.length)return; [stu.blocks[idx],stu.blocks[newIdx]]=[stu.blocks[newIdx],stu.blocks[idx]]; setData(data); renderBlocks(stu.blocks); }
function updateBlock(id,key,val){ let data=getData(), stu=data.students.find(s=>s.login===currentEditLogin); let block=stu.blocks.find(b=>b.id===id); if(block) block.data[key]=val; setData(data); }
function updateOption(blockId,optIdx,val){ let data=getData(), stu=data.students.find(s=>s.login===currentEditLogin); let block=stu.blocks.find(b=>b.id===blockId); if(block) block.data.options[optIdx]=val; setData(data); }
function addOption(blockId){ let data=getData(), stu=data.students.find(s=>s.login===currentEditLogin); let block=stu.blocks.find(b=>b.id===blockId); if(block&&block.data.options.length<6) block.data.options.push(''); setData(data); renderBlocks(stu.blocks); }
function removeOption(blockId,optIdx){ let data=getData(), stu=data.students.find(s=>s.login===currentEditLogin); let block=stu.blocks.find(b=>b.id===blockId); if(block&&block.data.options.length>2){ block.data.options.splice(optIdx,1); if(block.data.correct>=block.data.options.length) block.data.correct=0; } setData(data); renderBlocks(stu.blocks); }
function loadImage(event,blockId){ let file=event.target.files[0]; if(!file)return; let reader=new FileReader(); reader.onload=e=>{ let data=getData(), stu=data.students.find(s=>s.login===currentEditLogin); let block=stu.blocks.find(b=>b.id===blockId); if(block) block.data.url=e.target.result; setData(data); renderBlocks(stu.blocks); }; reader.readAsDataURL(file); }
function renderFormula(input,previewEl){ if(!window.katex) return; try{ previewEl.innerHTML=''; window.katex.render(input.value,previewEl,{displayMode:true,throwOnError:false}); }catch(e){ previewEl.textContent='Ошибка формулы'; } }
function renderAllFormulas(){ if(!window.katex){ setTimeout(renderAllFormulas,300); return; } document.querySelectorAll('[id^="fp-"]').forEach(el=>{ let inp=el.previousElementSibling; if(inp&&inp.value) try{ el.innerHTML=''; window.katex.render(inp.value,el,{displayMode:true,throwOnError:false}); }catch(e){} }); }
function savePage(){ let notice=document.getElementById('saved-notice'); notice.classList.add('show'); setTimeout(()=>notice.classList.remove('show'),2000); let gh=getGH(); if(gh) syncToGitHub(gh,getData()); }

function renderStudentView(){ let stu=currentStudent; document.getElementById('sv-name').textContent=stu.name; document.getElementById('sv-subtitle').textContent='Ваши учебные материалы'; switchStudentTab(currentStudentTab); }
function switchStudentTab(tab){ currentStudentTab=tab; document.querySelectorAll('.view-tab').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tab)); document.getElementById('student-materials').style.display=tab==='materials'?'block':'none'; document.getElementById('student-homework').style.display=tab==='homework'?'block':'none'; document.getElementById('student-stats').style.display=tab==='stats'?'block':'none'; if(tab==='materials') renderMaterials(); if(tab==='homework') renderHomeworkStudent(); if(tab==='stats') renderStatsStudent(); }
function renderMaterials(){ let container=document.getElementById('student-materials'); container.innerHTML=''; (currentStudent.blocks||[]).forEach(block=>{ let div=document.createElement('div'); div.className='view-block'; if(block.type==='heading'){ let tag=block.data.level||'h2'; div.innerHTML=`<${tag}>${esc(block.data.text||'')}</${tag}>`; }
  else if(block.type==='text') div.innerHTML=`<p>${(block.data.text||'').replace(/\n/g,'<br>')}</p>`;
  else if(block.type==='formula') div.innerHTML=`<div class="formula-display katex-render" data-tex="${esc(block.data.tex||'')}"></div>`;
  else if(block.type==='image' && block.data.url) div.innerHTML=`<img src="${block.data.url}" style="max-width:100%;border-radius:8px"><p style="color:var(--text3);font-size:0.75rem">${esc(block.data.caption||'')}</p>`;
  else if(block.type==='video'){ let vid=ytId(block.data.url||''); if(vid) div.innerHTML=`<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe></div>${block.data.caption?`<p>${esc(block.data.caption)}</p>`:''}`; }
  else if(block.type==='audio'){ div.innerHTML=`<audio controls src="${esc(block.data.url||'')}" class="audio-player"></audio>${block.data.caption?`<p>${esc(block.data.caption)}</p>`:''}`; }
  else if(block.type==='quiz') renderQuizBlock(div,block);
  else if(block.type==='callout') div.innerHTML=`<div class="callout-block">${(block.data.text||'').replace(/\n/g,'<br>')}</div>`;
  else if(block.type==='divider') div.innerHTML=`<hr>`;
  else if(block.type==='file' && block.data.url) div.innerHTML=`<a class="file-download-btn" href="${block.data.url}" target="_blank">📎 ${esc(block.data.label||'Скачать')}</a>`;
  container.appendChild(div); }); if(window.katex && window.renderMathInElement) renderMathInElement(container,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); }
function renderQuizBlock(container,block){ let qid='quiz-'+block.id, opts=block.data.options||[], stu=currentStudent; if(!currentStudent.quizResults) currentStudent.quizResults={}; let saved=currentStudent.quizResults[block.id]||null; let optsHtml=opts.map((o,i)=>`<div class="quiz-opt" id="${qid}-opt-${i}" onclick="selectQuizOpt('${qid}',${i})">${esc(o||'Вариант '+(i+1))}</div>`).join(''); container.innerHTML=`<div class="quiz-card" id="${qid}"><div class="question">${esc(block.data.question||'Вопрос')}</div>${optsHtml}<button class="quiz-check-btn" onclick="checkQuizAndSave('${block.id}','${qid}',${block.data.correct||0},'${esc(block.data.hint||'')}')">Проверить</button><div class="quiz-result" id="${qid}-result"></div></div>`; if(saved){ let resDiv=document.getElementById(`${qid}-result`); if(resDiv) { if(saved.correct){ resDiv.textContent=`✓ Правильно (попыток: ${saved.attempts})`; resDiv.className='quiz-result ok'; } else { resDiv.textContent=`✗ Неверно (попыток: ${saved.attempts})`; resDiv.className='quiz-result fail'; } } } }
let quizSelections={};
function selectQuizOpt(qid,idx){ document.querySelectorAll(`[id^="${qid}-opt-"]`).forEach(el=>el.classList.remove('selected')); document.getElementById(`${qid}-opt-${idx}`)?.classList.add('selected'); quizSelections[qid]=idx; }
function checkQuizAndSave(blockId,qid,correct,hint){ let sel=quizSelections[qid]; let resDiv=document.getElementById(`${qid}-result`); if(sel===undefined){resDiv.textContent='Выберите вариант';return;} document.querySelectorAll(`[id^="${qid}-opt-"]`).forEach((el,i)=>{el.classList.remove('selected','correct','wrong'); if(i===correct) el.classList.add('correct'); else if(i===sel) el.classList.add('wrong');}); let isCorrect=(sel===correct); let data=getData(), stu=data.students.find(s=>s.login===currentStudent.login); if(!stu.quizResults) stu.quizResults={}; if(!stu.quizResults[blockId]) stu.quizResults[blockId]={attempts:0,correctCount:0}; stu.quizResults[blockId].attempts++; if(isCorrect) stu.quizResults[blockId].correctCount++; setData(data); currentStudent=stu; if(isCorrect){ resDiv.textContent=`✓ Правильно! ${hint?hint:''} (попыток: ${stu.quizResults[blockId].attempts})`; resDiv.className='quiz-result ok'; } else { resDiv.textContent=`✗ Неверно. ${hint?'Подсказка: '+hint:''} (попыток: ${stu.quizResults[blockId].attempts})`; resDiv.className='quiz-result fail'; } }
function renderHomeworkStudent(){ let container=document.getElementById('student-homework'); let homeworks=currentStudent.homeworks||[]; if(homeworks.length===0){ container.innerHTML='<p>📭 Нет домашних заданий</p>'; return; } let now=new Date(); let rows=homeworks.map(hw=>{ let deadline=new Date(hw.deadline); let statusClass='', statusText=''; if(hw.completed) { statusClass='status-done'; statusText='✅ Выполнено'; } else if(deadline<now){ statusClass='deadline-overdue'; statusText='⏰ Просрочено'; } else if((deadline-now)/(1000*3600*24)<3){ statusClass='deadline-soon'; statusText='⚠️ Скоро'; } else { statusText='⏳ Ожидает'; } return `<tr><td>${esc(hw.title)}</td><td>${esc(hw.description||'')}</td><td class="${statusClass}">${deadline.toLocaleDateString()}</td><td class="${statusClass}">${statusText}</td></tr>`; }).join(''); container.innerHTML=`<div class="homework-section"><table class="homework-table"><thead><tr><th>Задание</th><th>Описание</th><th>Дедлайн</th><th>Статус</th></tr></thead><tbody>${rows}</tbody></table></div>`; }
function renderStatsStudent(){ let container=document.getElementById('student-stats'); let results=currentStudent.quizResults||{}; let totalAttempts=0, totalCorrect=0; Object.values(results).forEach(r=>{totalAttempts+=r.attempts; totalCorrect+=r.correctCount;}); let percent=totalAttempts>0?Math.round(totalCorrect/totalAttempts*100):0; let statsHtml=Object.entries(results).map(([id,stat])=>{ let block=currentStudent.blocks.find(b=>b.id===id); let qText=block?block.data.question||'Тест':'Тест'; return `<div class="stats-card"><strong>${esc(qText)}</strong><br>Попыток: ${stat.attempts}, Верных ответов: ${stat.correctCount} (${stat.attempts>0?Math.round(stat.correctCount/stat.attempts*100):0}%)</div>`; }).join(''); container.innerHTML=`<div class="stats-grid"><div class="stats-card"><strong>📊 Общая статистика</strong><br>Всего попыток: ${totalAttempts}<br>Правильных ответов: ${totalCorrect}<br>Процент верных: ${percent}%</div></div><h3 style="margin-top:1rem;margin-bottom:0.5rem">Детали по тестам:</h3>${statsHtml||'<p>Нет данных по тестам</p>'}`; }
function ytId(url){ let m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/); return m?m[1]:null; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function openGitHubModal(){ let gh=getGH()||{}; document.getElementById('gh-user').value=gh.user||''; document.getElementById('gh-repo').value=gh.repo||''; document.getElementById('gh-token').value=gh.token||''; document.getElementById('github-modal').style.display='flex'; }
function closeModal(){ document.getElementById('github-modal').style.display='none'; }
function saveGitHubConfig(){ let cfg={user:document.getElementById('gh-user').value.trim(),repo:document.getElementById('gh-repo').value.trim(),token:document.getElementById('gh-token').value.trim()}; if(!cfg.user||!cfg.repo||!cfg.token){alert('Заполните все поля');return;} setGH(cfg); closeModal(); document.getElementById('github-info').style.display='none'; alert('✓ GitHub настроен!'); }
async function syncToGitHub(gh,data){ let path='data/students.json'; let url=`https://api.github.com/repos/${gh.user}/${gh.repo}/contents/${path}`; let content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))); try{ let sha=''; let existing=await fetch(url,{headers:{'Authorization':'token '+gh.token}}); if(existing.ok){let j=await existing.json(); sha=j.sha;} await fetch(url,{method:'PUT',headers:{'Authorization':'token '+gh.token,'Content-Type':'application/json'},body:JSON.stringify({message:'Update data',content,sha})}); }catch(e){console.error(e);} }
function exportToPDF(){ window.print(); }
tryLoadFromGitHub();
function tryLoadFromGitHub(){ let gh=getGH(); if(!gh)return; fetch(`https://api.github.com/repos/${gh.user}/${gh.repo}/contents/data/students.json`,{headers:{'Authorization':'token '+gh.token}}).then(res=>res.ok?res.json():null).then(j=>{if(j){let text=decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))); let data=JSON.parse(text); localStorage.setItem('tutor_data',JSON.stringify(data));}}).catch(e=>{}); }
document.getElementById('stu-pass').addEventListener('keydown',e=>{if(e.key==='Enter')loginStudent();});
document.getElementById('tutor-pass').addEventListener('keydown',e=>{if(e.key==='Enter')loginTutor();});
</script>
